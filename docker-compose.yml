services:
  whatsapp-bot:
    build: .
    container_name: jarvis-whatsapp-bot
    restart: unless-stopped
    volumes:
      - ./.env:/app/.env
      - ./personal.db:/app/personal.db
      - ./.wwebjs_auth:/app/.wwebjs_auth
      - ./.wwebjs_cache:/app/.wwebjs_cache
      - ./AGENT.md:/app/AGENT.md
    environment:
      - OLLAMA_URL=http://127.0.0.1:11434
      - TZ=Asia/Kuala_Lumpur
      - NODE_ENV=production
    stdin_open: true
    tty: true
    network_mode: host
